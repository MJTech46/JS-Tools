<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevToolkit Hub</title>
    <style>
      /* ==========================================================================
       DESIGN SYSTEM VARIABLES (DARK THEME - DEFAULT)
       ========================================================================== */
      :root,
      [data-theme="dark"] {
        --bg-main: #090d16;
        --bg-card: rgba(19, 27, 46, 0.6);
        --bg-card-hover: rgba(25, 36, 61, 0.8);
        --border-color: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(99, 102, 241, 0.5);

        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;

        --accent-primary: #6366f1; /* Indigo */
        --accent-glow: rgba(99, 102, 241, 0.25);
        --search-bg: rgba(15, 23, 42, 0.8);
        --icon-bg: rgba(255, 255, 255, 0.03);
        --tag-bg: rgba(255, 255, 255, 0.05);

        --bg-gradient:
          radial-gradient(
            circle at 50% 0%,
            rgba(99, 102, 241, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.05) 0%,
            transparent 40%
          );
        --heading-gradient: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
        --card-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
      }

      /* ==========================================================================
       LIGHT THEME OVERRIDES
       ========================================================================== */
      [data-theme="light"] {
        --bg-main: #f8fafc;
        --bg-card: rgba(255, 255, 255, 0.75);
        --bg-card-hover: rgba(255, 255, 255, 0.95);
        --border-color: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(79, 70, 229, 0.4);

        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;

        --accent-primary: #4f46e5;
        --accent-glow: rgba(79, 70, 229, 0.15);
        --search-bg: rgba(255, 255, 255, 0.85);
        --icon-bg: rgba(0, 0, 0, 0.04);
        --tag-bg: rgba(0, 0, 0, 0.05);

        --bg-gradient:
          radial-gradient(
            circle at 50% 0%,
            rgba(79, 70, 229, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.05) 0%,
            transparent 40%
          );
        --heading-gradient: linear-gradient(135deg, #0f172a 0%, #334155 100%);
        --card-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.08);
      }

      /* Shared Dimensions & Fonts */
      :root {
        --radius-lg: 16px;
        --radius-md: 10px;
        --radius-sm: 6px;

        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        --font-mono:
          "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
      }

      /* ==========================================================================
       BASE STYLES
       ========================================================================== */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: var(--font-sans);
        min-height: 100vh;
        line-height: 1.5;
        padding: 2rem 1.5rem 4rem;
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        position: relative;
      }

      /* ==========================================================================
       TOP BAR & THEME TOGGLE
       ========================================================================== */
      .top-bar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
      }

      .theme-toggle {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        font-weight: 500;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }

      .theme-toggle:hover {
        border-color: var(--accent-primary);
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .theme-toggle svg {
        width: 16px;
        height: 16px;
      }

      /* Toggle visibility depending on current theme */
      [data-theme="dark"] .sun-icon {
        display: block;
      }
      [data-theme="dark"] .moon-icon {
        display: none;
      }

      [data-theme="light"] .sun-icon {
        display: none;
      }
      [data-theme="light"] .moon-icon {
        display: block;
      }

      /* ==========================================================================
       HEADER & HERO
       ========================================================================== */
      header {
        margin-bottom: 3rem;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.3);
        color: var(--accent-primary);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }

      .badge-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-primary);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-primary);
      }

      h1 {
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: var(--heading-gradient);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.75rem;
      }

      p.subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
        max-width: 550px;
        margin: 0 auto 2rem;
      }

      /* Search Bar */
      .search-wrapper {
        position: relative;
        max-width: 480px;
        margin: 0 auto;
      }

      .search-input {
        width: 100%;
        padding: 12px 16px 12px 44px;
        background: var(--search-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
        backdrop-filter: blur(8px);
      }

      .search-input:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        width: 18px;
        height: 18px;
      }

      /* ==========================================================================
       TOOL CARDS GRID
       ========================================================================== */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(12px);
        position: relative;
        overflow: hidden;
      }

      /* Top Accent Line on Hover */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-primary),
          transparent
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow:
          var(--card-shadow),
          0 0 20px var(--accent-glow);
      }

      .card:hover::before {
        opacity: 1;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .icon-box {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        background: var(--icon-bg);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-primary);
        transition:
          transform 0.2s ease,
          background-color 0.2s ease;
      }

      .card:hover .icon-box {
        transform: scale(1.05);
        background: rgba(99, 102, 241, 0.15);
      }

      .tag {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--tag-bg);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
      }

      .card-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-title svg {
        width: 16px;
        height: 16px;
        opacity: 0;
        transform: translateX(-4px);
        transition: all 0.2s ease;
        color: var(--accent-primary);
      }

      .card:hover .card-title svg {
        opacity: 1;
        transform: translateX(0);
      }

      .card-description {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.5;
      }

      .card-footer {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }

      /* Error Card Component */
      .card.error-card {
        border-color: rgba(244, 63, 94, 0.35);
        background: rgba(244, 63, 94, 0.05);
        cursor: default;
      }

      .card.error-card:hover {
        transform: none;
        border-color: rgba(244, 63, 94, 0.6);
        box-shadow: 0 4px 20px var(--shadow-color);
      }

      .error-card .icon-box {
        background: rgba(244, 63, 94, 0.12);
        border-color: rgba(244, 63, 94, 0.25);
        color: #f43f5e;
      }

      .error-card .tag {
        background: rgba(244, 63, 94, 0.15);
        color: #f43f5e;
      }

      .error-card .card-title {
        color: #f43f5e;
      }

      .error-card .card-description {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .error-card .card-footer {
        border-top-color: rgba(244, 63, 94, 0.2);
        color: #f43f5e;
        font-weight: 500;
      }

      /* ==========================================================================
       FOOTER
       ========================================================================== */
      footer {
        margin-top: 4rem;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.85rem;
        border-top: 1px solid var(--border-color);
        padding-top: 2rem;
      }

      footer code {
        font-family: var(--font-mono);
        background: var(--tag-bg);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Top Bar with Theme Toggle -->
      <div class="top-bar">
        <button
          class="theme-toggle"
          id="themeToggleBtn"
          aria-label="Toggle light and dark mode"
        >
          <!-- Sun icon (shown in dark mode) -->
          <svg
            class="sun-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg
            class="moon-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
          <span id="themeToggleText">Light Mode</span>
        </button>
      </div>

      <!-- Header Section -->
      <header>
        <div class="badge">
          <span class="badge-dot"></span> made by mjtech46
        </div>
        <h1>Developer Utilities</h1>
        <p class="subtitle">
          A fast, online-first collection of daily developer tools for free.
        </p>

        <!-- Quick Search Filter -->
        <div class="search-wrapper">
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search tool or keyword (e.g. json, epoch, rgb)..."
            autocomplete="off"
          />
        </div>
      </header>

      <!-- Tools Grid -->
      <main class="grid" id="toolsGrid"></main>

      <!-- Footer -->
      <footer>
        <p>
          Organized under <code>tools-config.json</code> • Built for fast online
          productivity
        </p>
      </footer>
    </div>

    <!-- JavaScript Logic -->
    <script>
      // --------------------------------------------------------------------------
      // Theme Switcher Logic
      // --------------------------------------------------------------------------
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeToggleText = document.getElementById("themeToggleText");
      const htmlElement = document.documentElement;

      // Check system preference or saved preference
      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;

      function applyTheme(theme) {
        htmlElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        if (theme === "dark") {
          themeToggleText.textContent = "Light Mode";
        } else {
          themeToggleText.textContent = "Dark Mode";
        }
      }

      // Initialize Theme
      if (savedTheme) {
        applyTheme(savedTheme);
      } else {
        applyTheme(systemPrefersDark ? "dark" : "light");
      }

      // Toggle on button click
      themeToggleBtn.addEventListener("click", () => {
        const currentTheme = htmlElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(newTheme);
      });

      // --------------------------------------------------------------------------
      // Load Tools from Config File
      // --------------------------------------------------------------------------

async function loadTools() {
  const grid = document.getElementById("toolsGrid");

  try {
    const response = await fetch("/tools-config.json");

    if (!response.ok) {
      // Handle HTTP errors (404, 500, etc.)
      grid.innerHTML = `
        <div class="card error-card">
          <div class="card-header">
            <div class="icon-box">⚠️</div>
            <span class="tag">ERROR</span>
          </div>
          <h2 class="card-title">Error Loading Tools</h2>
          <p class="card-description">
            Server responded with <strong>${response.status} ${response.statusText}</strong> 
            for the <code>tools-config.json</code> file.
          </p>
          <div class="card-footer">
            <span>tools-config.json</span>
            <span>failed</span>
          </div>
        </div>
      `;
      return;
    }

    const data = await response.json();

    data.tools.forEach(tool => {
      const card = tool.card;

      const cardHTML = `
        <a href="${card.url}" class="card" data-tags="${card.tags.join(' ')}">
          <div>
            <div class="card-header">
              <div class="icon-box">${card.icon}</div>
              <span class="tag">${card.category}</span>
            </div>
            <h2 class="card-title">
              ${card.title}
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </h2>
            <p class="card-description">${card.description}</p>
          </div>
          <div class="card-footer">
            <span>${card.footer.slug}</span>
            <span>${card.footer.version}</span>
          </div>
        </a>
      `;

      grid.insertAdjacentHTML("beforeend", cardHTML);
    });
  } catch (err) {
    // Handle network errors (server down, no internet, etc.)
    grid.innerHTML = `
      <div class="card error-card">
        <h2>❌ Failed to Load Tools</h2>
        <p>${err.message}</p>
        <p>Check your connection or try again later.</p>
      </div>
    `;
    console.error("Error loading tools:", err);
  }
}

// Run on page load
loadTools();


      // --------------------------------------------------------------------------
      // Search Filter Logic
      // --------------------------------------------------------------------------
      const searchInput = document.getElementById("searchInput");
      const cards = document.querySelectorAll(".card");

      searchInput.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase().trim();
        const cards = document.querySelectorAll(".card"); // re‑query each time

        cards.forEach((card) => {
          const title = card
            .querySelector(".card-title")
            .textContent.toLowerCase();
          const description = card
            .querySelector(".card-description")
            .textContent.toLowerCase();
          const tags = (card.getAttribute("data-tags") || "").toLowerCase();

          if (
            title.includes(query) ||
            description.includes(query) ||
            tags.includes(query)
          ) {
            card.style.display = ""; // let CSS handle layout
          } else {
            card.style.display = "none";
          }
        });
      });
    </script>
  </body>
</html>
